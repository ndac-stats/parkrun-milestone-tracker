name: Update parkrun milestone data

on:
  # Weekly only: keep requests infrequent and avoid unnecessary load.
  schedule:
    - cron: "30 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch athlete histories
        run: python scripts/update_results.py
      - name: Commit updated snapshot
        run: |
          if [[ -n "$(git status --porcelain data/milestones.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/milestones.json
            git commit -m "Update parkrun milestone data"
            git push
          else
            echo "No data changes to commit"
          fi
